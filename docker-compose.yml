services:
  postgres:
    image: postgres:17-alpine
    container_name: afya-postgres
    environment:
      POSTGRES_USER: afya
      POSTGRES_PASSWORD: afya
      POSTGRES_DB: afya
    # Host port 5435 avoids clashing with mi7rab (5433) and other local Postgres.
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afya -d afya"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
